services:
  arxiv-daily-researcher:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
      # 与运行期一致使用宿主机网络，避免 NAS 的 bridge DNS/路由导致依赖构建极慢。
      network: host
      args:
        PIP_INDEX_URL: ${ADR_PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${ADR_PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    # 默认使用本地构建镜像；部署者可通过 ADR_WORKER_IMAGE 覆盖为固定的
    # GHCR 版本标签。保留 build 以支持源码部署和本地开发。
    image: ${ADR_WORKER_IMAGE:-arxiv-daily-researcher:latest}
    container_name: arxiv-daily-researcher
    restart: unless-stopped

    stdin_open: true
    tty: true

    # 使用宿主机网络，使容器可直接访问 localhost 上的本地 LLM API 等服务
    network_mode: host

    env_file:
      - .env

    environment:
      - TZ=Asia/Shanghai
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - RUN_ON_STARTUP=false
      - MODE=cron
      - SETUP_WIZARD=auto

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./runtime:/app/runtime
      - ./.env:/app/.env

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    healthcheck:
      test: [ "CMD", "python", "/app/src/utils/container_health.py", "worker" ]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Modern WebUI ====================
  config-panel:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: webui
      # WebUI 构建同样需要稳定访问 Python 软件源。
      network: host
      args:
        PIP_INDEX_URL: ${ADR_PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${ADR_PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    # 与 worker 保持相同的版本来源，避免 WebUI 与后端协议错配。
    image: ${ADR_WEBUI_IMAGE:-arxiv-daily-researcher-config-panel:latest}
    container_name: arxiv-daily-researcher-config-panel
    restart: unless-stopped

    # Match the worker's localhost semantics so WebUI connection tests can
    # reach host-side proxies and local LLM services exactly as scheduled jobs
    # do. Keep the browser service on loopback by default. A trusted Tailnet
    # deployment may set ADR_WEBUI_BIND_HOST to this host's Tailscale IPv4;
    # do not use 0.0.0.0 without a deliberately configured access boundary.
    network_mode: host
    command:
      - uvicorn
      - src.modern_webui.app:app
      - --host
      - ${ADR_WEBUI_BIND_HOST:-127.0.0.1}
      - --port
      - "8501"

    environment:
      - TZ=Asia/Shanghai
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}

    volumes:
      - ./configs:/app/configs
      - ./runtime:/app/runtime
      - ./.env:/app/.env
      - ./.env.example:/app/.env.example:ro
      - ./data:/app/data
      - ./logs:/app/logs

    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M

    healthcheck:
      test: [ "CMD", "python", "/app/src/utils/container_health.py", "webui", "--url", "http://${ADR_WEBUI_BIND_HOST:-127.0.0.1}:8501/api/health" ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
