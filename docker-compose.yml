name: arxiv-daily-researcher

services:
  arxiv-daily-researcher:
    image: ghcr.io/yzr278892/arxiv-daily-researcher:4.2
    container_name: arxiv-daily-researcher
    restart: unless-stopped

    stdin_open: true
    tty: true

    # The worker must reach a host-local LLM or proxy through localhost.
    network_mode: host

    env_file:
      - .env

    environment:
      - TZ=Asia/Shanghai
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - RUN_ON_STARTUP=false
      - MODE=cron
      - SETUP_WIZARD=auto

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./runtime:/app/runtime
      - ./.env:/app/.env

    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 384M

    memswap_limit: 1024M

    healthcheck:
      test: ["CMD", "python", "/app/src/utils/container_health.py", "worker"]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  config-panel:
    image: ghcr.io/yzr278892/arxiv-daily-researcher-config-panel:4.2
    container_name: arxiv-daily-researcher-config-panel
    restart: unless-stopped

    ports:
      - "8501:8501"
    # The WebUI uses a bridge network for its explicit browser port. Use this
    # alias when testing a host-local service from the panel.
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - uvicorn
      - src.modern_webui.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8501"

    environment:
      - TZ=Asia/Shanghai
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}

    volumes:
      - ./configs:/app/configs
      - ./runtime:/app/runtime
      - ./.env:/app/.env
      - ./.env.example:/app/.env.example:ro
      - ./data:/app/data
      - ./logs:/app/logs

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 96M

    memswap_limit: 384M

    healthcheck:
      test: ["CMD", "python", "/app/src/utils/container_health.py", "webui", "--url", "http://127.0.0.1:8501/api/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
