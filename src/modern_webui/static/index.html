<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f9fc" />
    <title>ArXiv Daily Researcher</title>
    <link rel="stylesheet" href="/assets/app.css?v=__ASSET_VERSION__" />
  </head>
  <body>
    <div id="app" class="app-shell" hidden>
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">A</div>
          <div>
            <strong>ArXiv Researcher</strong>
            <span id="version-label">现代管理面板</span>
          </div>
        </div>
        <nav id="group-navigation" class="group-navigation" aria-label="主导航"></nav>
        <div class="sidebar-actions">
          <button id="save-button" class="primary-button wide-button">保存所有更改</button>
          <button id="reload-button" class="secondary-button wide-button">重新加载配置</button>
          <button id="restart-worker-button" class="secondary-button wide-button">重启研究容器</button>
          <button id="theme-button" class="secondary-button wide-button" type="button">深色模式</button>
          <button id="language-button" class="secondary-button wide-button" type="button">English</button>
          <button id="logout-button" class="secondary-button wide-button" type="button">退出登录</button>
        </div>
        <div class="sidebar-meta">
          <p id="file-status">正在读取配置文件…</p>
        </div>
      </aside>
      <main class="main-area">
        <div id="top-tabs" class="top-tabs" role="tablist" aria-label="页面导航"></div>
        <section id="page-root" class="page-root" aria-live="polite"></section>
      </main>
    </div>

    <div id="auth" class="auth-shell" hidden>
      <section class="auth-card">
        <div class="brand-mark large">A</div>
        <p class="eyebrow">ArXiv Daily Researcher</p>
        <h1 id="auth-title">登录管理面板</h1>
        <p id="auth-hint" class="muted">正在读取账户设置…</p>
        <form id="login-form" class="stack-form" hidden>
          <label>用户名<input id="login-username" autocomplete="username" required /></label>
          <label>密码<input id="login-password" type="password" autocomplete="current-password" required /></label>
          <button class="primary-button" type="submit">登录</button>
        </form>
        <form id="setup-form" class="stack-form" hidden>
          <label>管理员用户名<input id="setup-username" autocomplete="username" required /></label>
          <label>密码（至少 6 个字符）<input id="setup-password" type="password" autocomplete="new-password" required /></label>
          <label>确认密码<input id="setup-password-confirmation" type="password" autocomplete="new-password" required /></label>
          <button class="primary-button" type="submit">创建管理员账户</button>
          <button id="skip-auth-button" class="secondary-button" type="button">仅内网使用，跳过登录</button>
        </form>
        <p id="auth-error" class="error-message" role="alert"></p>
      </section>
    </div>

    <div id="toast" class="toast" hidden role="status"></div>
    <script src="/assets/app.js?v=__ASSET_VERSION__" defer></script>
  </body>
</html>
