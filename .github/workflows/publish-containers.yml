name: Publish Container Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Validate release version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          test -n "$tag_version"
          test "$tag_version" = "$file_version"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-webui.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt -r requirements-webui.txt pytest

      - name: Run regression suite
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check browser assets and interactions
        run: |
          node --check src/modern_webui/static/app.js
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:browser

  publish:
    name: Build and publish multi-architecture images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Derive image version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=ArXiv Daily Researcher
            org.opencontainers.image.description=LLM-powered paper monitoring and analysis worker
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Publish WebUI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: webui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-config-panel:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}-config-panel:latest
          labels: |
            org.opencontainers.image.title=ArXiv Daily Researcher Modern WebUI
            org.opencontainers.image.description=Modern management WebUI for ArXiv Daily Researcher
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=webui
          cache-to: type=gha,mode=max,scope=webui
