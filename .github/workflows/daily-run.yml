name: ArXiv Daily Research

on:
  # ⚠️  定时触发默认关闭，防止 Fork 后未配置 Secrets 就自动运行报错。
  # 完成 Secrets 配置后，取消下方注释即可开启每日自动运行。
  #
  # schedule:
  #   # 每天 UTC 00:00 运行 (= 北京时间 08:00)
  #   - cron: '0 0 * * *'

  # 支持手动触发。v4.2 固定回看最近 3 天；更早日期请使用过去日报队列。
  workflow_dispatch:

# GitHub Actions 的 SQLite 状态缓存是同一个逻辑数据源；日常与趋势任务不能
# 并发恢复和保存它，否则可能各自基于不同快照运行。
concurrency:
  group: research-state
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    # A complete time-window scan can legitimately take longer when upstream
    # services rate-limit requests.  Do not turn this into a paper-count cap.
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-core.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-core.txt

      - name: Create .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          CHEAP_LLM__API_KEY=${{ secrets.CHEAP_LLM_API_KEY }}
          CHEAP_LLM__BASE_URL=${{ secrets.CHEAP_LLM_BASE_URL }}
          CHEAP_LLM__MODEL_NAME=${{ secrets.CHEAP_LLM_MODEL_NAME }}
          CHEAP_LLM__TEMPERATURE=${{ secrets.CHEAP_LLM_TEMPERATURE }}
          CHEAP_LLM__PARAMETER_MODE=auto
          CHEAP_LLM__REASONING_EFFORT=medium
          SMART_LLM__API_KEY=${{ secrets.SMART_LLM_API_KEY }}
          SMART_LLM__BASE_URL=${{ secrets.SMART_LLM_BASE_URL }}
          SMART_LLM__MODEL_NAME=${{ secrets.SMART_LLM_MODEL_NAME }}
          SMART_LLM__TEMPERATURE=${{ secrets.SMART_LLM_TEMPERATURE }}
          SMART_LLM__PARAMETER_MODE=auto
          SMART_LLM__REASONING_EFFORT=medium
          OPENALEX_API_KEY=${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY=${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          ENABLE_NOTIFICATIONS=${{ secrets.ENABLE_NOTIFICATIONS }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          SMTP_TO=${{ secrets.SMTP_TO }}
          WECHAT_WEBHOOK_URL=${{ secrets.WECHAT_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL=${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET=${{ secrets.DINGTALK_SECRET }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
          GENERIC_WEBHOOK_URL=${{ secrets.GENERIC_WEBHOOK_URL }}
          ENVEOF

      - name: Restore previous data
        uses: actions/cache/restore@v4
        with:
          path: |
            data/keywords/
            data/daily_research/
          key: research-state-${{ github.run_id }}
          restore-keys: |
            research-state-

      - name: Create data directories
        run: |
          mkdir -p data/reports/daily_research/markdown \
                   data/reports/daily_research/html \
                   data/reports/trend_research/markdown \
                   data/reports/trend_research/html \
                   data/reports/keyword_trend/markdown \
                   data/reports/keyword_trend/html \
                   data/keywords data/daily_research data/run \
                   data/reference_pdfs data/downloaded_pdfs logs

      - name: Run research pipeline
        run: python main.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-reports-${{ github.run_number }}
          path: |
            data/reports/
            logs/
          retention-days: 30

      - name: Save data for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/keywords/
            data/daily_research/
          key: research-state-${{ github.run_id }}
